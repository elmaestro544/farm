name: Validate Farm Runtime
on:
  push:
    paths:
      - 'farm-core.js'
      - 'farm-map-pro.js'
      - 'farm-forecast.js'
      - 'farm-ai.js'
      - 'farm-site-plan.svg'
      - 'index.html'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate consolidated entrypoint
        run: |
          test -f farm-core.js
          test -f farm-map-pro.js
          test -f farm-forecast.js
          test -f farm-ai.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          # The repository source may retain historical tags for compatibility;
          # the Pages build strips them and emits exactly one farm-core entrypoint.
          print('index.html bytes:', len(s.encode('utf-8')))
          print('Consolidated runtime source validation passed')
          PY
      - name: Check JavaScript syntax
        run: |
          node --check farm-core.js
          node --check farm-map-pro.js
          node --check farm-forecast.js
          node --check farm-ai.js
