name: Integrate Farm UI Upgrade
on:
  push:
    paths:
      - 'farm-state-upgrade.js'
      - 'farm-master-plan.svg'
      - 'farm-site-plan.svg'
      - 'farm-performance-fix.js'
      - '.github/workflows/integrate-farm-upgrade.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy inline map image and integrate scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'(<div class="map-canvas">\s*<img\s+)src="data:image/[^\"]+"'
          s,n=re.subn(pattern, r'\1src="farm-site-plan.svg?v=20260821-2"', s, count=1)
          print('Replaced inline base64 map image:', n)
          tags=[
            '<script src="farm-state-upgrade.js"></script>',
            '<script src="farm-performance-fix.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'perf: remove inline map payload and optimize dashboard'
          git push
