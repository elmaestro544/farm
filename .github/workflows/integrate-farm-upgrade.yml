name: Integrate Farm UI Upgrade
on:
  push:
    paths:
      - 'farm-state-upgrade.js'
      - 'farm-master-plan.svg'
      - 'farm-site-plan.svg'
      - 'farm-performance-fix.js'
      - '.github/workflows/integrate-farm-upgrade.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject upgrade and performance scripts into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="farm-state-upgrade.js"></script>',
            '<script src="farm-performance-fix.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore: integrate farm performance guard'
          git push
