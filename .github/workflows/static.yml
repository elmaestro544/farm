# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject application modules
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
              '<script src="energy-upgrade.js"></script>',
              '<script src="ledger-excel-upgrade.js"></script>',
              '<script src="ledger-mapping-upgrade.js"></script>',
              '<script src="finance-dashboard-upgrade.js"></script>',
              '<script src="shareholders-upgrade.js"></script>',
              '<script src="calculation-transparency.js"></script>',
              '<script src="homepage-transparency-upgrade.js"></script>',
              '<script src="universal-transparency-upgrade.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
