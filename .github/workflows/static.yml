# Tanida Farm — consolidated GitHub Pages deployment
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build consolidated runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          modules=[
            'farm-state-upgrade.js','farm-performance-fix.js','farm-map-pro.js',
            'farm-visuals-upgrade.js','farm-visual-intelligence.js',
            'energy-upgrade.js','ledger-excel-upgrade.js','ledger-mapping-upgrade.js',
            'finance-dashboard-upgrade.js','shareholders-upgrade.js','calculation-transparency.js',
            'homepage-transparency-upgrade.js','universal-transparency-upgrade.js','transparency-popup-upgrade.js'
          ]
          for name in modules:
              s=re.sub(r'\\s*<script[^>]+src=["\\']'+re.escape(name)+r'["\\'][^>]*></script>\\s*', '\\n', s, flags=re.I)
          s=re.sub(r'\\s*<script[^>]+src=["\\']farm-core\\.js[^"\\']*["\\'][^>]*></script>\\s*', '\\n', s, flags=re.I)
          s=s.replace('</body>', '  <script src="farm-core.js"></script>\\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate consolidated runtime
        run: |
          test -f farm-core.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('farm-core.js') == 1, 'farm-core.js must be loaded exactly once'
          for legacy in ['farm-state-upgrade.js','farm-performance-fix.js','farm-map-pro.js']:
              assert legacy not in s, f'legacy external module still injected: {legacy}'
          print('Consolidated runtime validation passed')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
